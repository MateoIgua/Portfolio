name: Deploy Angular frontend to Azure Static Web Apps

# Requiere el secret AZURE_STATIC_WEB_APPS_API_TOKEN (ver docs/DESPLIEGUE-AZURE.md).

on:
  push:
    branches: [master]
    paths:
      - 'frontend-angular/**'
      - '.github/workflows/deploy-azure-frontend.yml'
  workflow_dispatch:

concurrency:
  group: azure-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend-angular/package-lock.json

      - name: Build Angular
        working-directory: frontend-angular
        run: |
          npm ci
          npm run build

      # El build ya se hizo arriba, así que Static Web Apps solo sube los archivos.
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend-angular/dist/portfolio-angular/browser
          skip_app_build: true
          skip_api_build: true
